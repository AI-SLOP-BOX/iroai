[workspace]
members = [
    "crates/iroai-core",
    "crates/iroai-gpu",
    "crates/iroai-moufu",
    "crates/iroai-cli",
    "crates/iroai-gui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Iroai Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ai-slop-box/iroai"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff"] }
bytemuck = { version = "1.18", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
wgpu = "22.0"
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
rfd = "0.15"
